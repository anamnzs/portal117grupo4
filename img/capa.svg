<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Mina a céu aberto com um celular dentro</title>
  <desc id="d">Mina em degraus cortando camadas de terra terracota, verde-musgo e grafite. No fundo da cova há um celular em pé, com Co, Ta e Au na tela. Pequenas silhuetas de mineiros estão nos degraus.</desc>

  <!-- céu e sol -->
  <rect width="560" height="560" fill="#E8DFD0"/>
  <circle cx="455" cy="100" r="42" fill="#FFFFFF"/>

  <!-- camadas de solo -->
  <rect y="250" width="560" height="50"  fill="#B4531F"/>
  <rect y="300" width="560" height="55"  fill="#3F5A47"/>
  <rect y="355" width="560" height="85"  fill="#1C1917"/>
  <rect y="440" width="560" height="120" fill="#FFFFFF"/>

  <!-- cova em degraus -->
  <path d="M110 245 V285 H150 V320 H190 V355 H370 V320 H410 V285 H450 V245 Z" fill="#E8DFD0"/>
  <path d="M110 250 V285 H150 V320 H190 V355 H370 V320 H410 V285 H450 V250"
        fill="none" stroke="#1C1917" stroke-width="5"/>
  <path d="M0 250 H110 M450 250 H560" stroke="#1C1917" stroke-width="5"/>

  <!-- mineiros nos degraus -->
  <defs>
    <g id="p" fill="#1C1917">
      <circle cx="0" cy="-27" r="5.5"/>
      <path d="M-6.5 0 V-16 a6.5 6.5 0 0 1 13 0 V0 Z"/>
    </g>
  </defs>
  <use href="#p" x="130" y="285"/>
  <use href="#p" x="172" y="320"/>
  <use href="#p" x="390" y="320"/>
  <use href="#p" x="430" y="285"/>

  <!-- celular -->
  <rect x="215" y="105" width="130" height="250" rx="20" fill="#FFFFFF" stroke="#1C1917" stroke-width="5"/>
  <rect x="227" y="127" width="106" height="206" rx="9" fill="#1C1917"/>
  <rect x="265" y="113" width="30" height="6" rx="3" fill="#1C1917"/>

  <rect x="237" y="143" width="86" height="50" rx="5" fill="#B4531F"/>
  <rect x="237" y="203" width="86" height="50" rx="5" fill="#3F5A47"/>
  <rect x="237" y="263" width="86" height="50" rx="5" fill="#E8DFD0"/>
  <g font-family="Merriweather, Georgia, 'Times New Roman', serif" font-weight="900" font-size="26" text-anchor="middle">
    <text x="280" y="177" fill="#FFFFFF">Co</text>
    <text x="280" y="237" fill="#FFFFFF">Ta</text>
    <text x="280" y="297" fill="#1C1917">Au</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
